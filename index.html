<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Nathália ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #1a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    font-family: 'Lato', sans-serif;
    overflow: hidden;
    position: relative;
  }
  .petals-bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .petal { position: absolute; opacity: 0; animation: fall linear infinite; }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,150,150,0.2);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(6px);
  }
  .hearts-top { display: flex; justify-content: center; gap: 10px; margin-bottom: 1.5rem; }
  .heart { color: #e85d7c; font-size: 1.4rem; animation: pulse 1.8s ease-in-out infinite; }
  .heart:nth-child(2) { animation-delay: 0.3s; font-size: 1.8rem; }
  .heart:nth-child(3) { animation-delay: 0.6s; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.2); }
  }
  .tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #e85d7c; margin-bottom: 0.6rem; }
  .name { font-family: 'Playfair Display', serif; font-size: 2.4rem; color: #fff; font-style: italic; margin-bottom: 1.6rem; line-height: 1.2; }
  .divider { width: 50px; height: 1px; background: rgba(232,93,124,0.5); margin: 0 auto 1.6rem; }
  .message { font-size: 1rem; line-height: 1.85; color: rgba(255,255,255,0.82); font-weight: 300; margin-bottom: 1.8rem; }
  .message em { font-family: 'Playfair Display', serif; font-style: italic; color: #f2a5b8; font-size: 1.05rem; }
  .date-stamp { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-top: 1rem; }
  .footer-hearts { margin-top: 1.8rem; color: #e85d7c; font-size: 1rem; letter-spacing: 6px; }
</style>
</head>
<body>
<div class="petals-bg" id="petals"></div>
<div class="card">
  <div class="hearts-top">
    <span class="heart">♡</span>
    <span class="heart">♥</span>
    <span class="heart">♡</span>
  </div>
  <p class="tag">Para você</p>
  <h1 class="name">Nathália</h1>
  <div class="divider"></div>
  <p class="message">
    Te mandei essa mensagem simples, mas de coração.<br><br>
    Quero que saiba que você é <em>muito especial</em> pra mim, meu amor —
    e sou muito feliz em ter você comigo. 🌹<br><br>
    <em>Feliz Dia dos Namorados.</em><br>
    Te amo infinitamente. ♾️
  </p>
  <div class="footer-hearts">♥ ♥ ♥</div>
  <p class="date-stamp">12 de junho de 2025</p>
</div>
<script>
  const emojis = ['🌸','🌹','💗','✨','🌷','💖'];
  const container = document.getElementById('petals');
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (6 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.fontSize = (0.8 + Math.random() * 0.8) + 'rem';
    container.appendChild(p);
  }
</script>
</body>
</html>
